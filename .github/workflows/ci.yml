name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays: new advisories appear without code changes

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"   # same as the Dockerfile's builder

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: End to end against k3s (Docker)
        run: cargo test --locked --test k3s -- --ignored

  audit:
    # Known vulnerabilities (RustSec) in Cargo.lock; ignores with reasons in .cargo/audit.toml.
    runs-on: ubuntu-24.04
    env:
      CARGO_AUDIT_VERSION: "0.22.2"   # at least two weeks old
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}
      - run: cargo install --locked "cargo-audit@$CARGO_AUDIT_VERSION"
      - run: cargo audit --deny warnings

  sizes:
    # Binary and image size: in the run summary on every run (with the change vs main); on main
    # also as badges on the `badges` branch (one commit, force-pushed), which README.md shows.
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used to push the badges branch, on main
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the image
        run: |
          docker buildx build . --platform linux/amd64 --load --tag k8s-sidecar-rs:ci \
            --cache-from type=gha,scope=sizes --cache-to type=gha,scope=sizes,mode=max
      - name: Sizes on main so far
        run: |
          if git fetch --quiet --depth=1 origin badges; then
            git show FETCH_HEAD:sizes.json > "$RUNNER_TEMP/previous.json"
          else
            echo "no badges branch yet"
          fi
      - name: Measure
        run: |
          python3 scripts/sizes.py k8s-sidecar-rs:ci --previous "$RUNNER_TEMP/previous.json" \
            --summary "$GITHUB_STEP_SUMMARY" --badges "$RUNNER_TEMP/badges"
      - name: Publish badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/badges"
          git init --quiet --initial-branch badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "Sizes at ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
