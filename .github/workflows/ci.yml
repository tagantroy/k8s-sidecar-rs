name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"   # same as the Dockerfile's builder

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: End to end against k3s (Docker)
        run: cargo test --locked --test k3s -- --ignored
